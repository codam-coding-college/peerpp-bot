# Configure these values according to the config.json file.

version: "3"
services:
  peerbot:
    container_name: "PeerBot"
    build: ./
    volumes:
       - ./config.json:/app/config.json
       - ./logs:/app/log
       - ./db:/app/db
    env_file:
      - ./.env
    ports:
      - "8080:8080"
    restart: on-failure:5
